<ion-item-sliding #slider>
  <ion-item lines="none" detail="false">
    <div class="content">
      <span class="info">
        <span class="name">{{ txn.note }}</span>
        <span class="sub">{{ txn.categoryName }} · {{ txn.accountName }}</span>
      </span>
      <span class="amt" [class.income]="txn.type === 'income'">
        {{ txn.type === 'income' ? '+' : '−' }}{{ txn.amount / 100 | currency: 'EUR' }}
      </span>
    </div>
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option color="danger" (click)="onDelete(slider)">
      <ion-icon slot="top" name="trash-outline"></ion-icon>
      Delete
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
