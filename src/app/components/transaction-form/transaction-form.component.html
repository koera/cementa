<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancelled.emit()">Cancel</ion-button>
    </ion-buttons>
    <ion-title>New transaction</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form">
    <div class="seg">
      <button type="button" class="chip" [class.on]="type === 'expense'" (click)="setType('expense')">Expense</button>
      <button type="button" class="chip" [class.on]="type === 'income'" (click)="setType('income')">Income</button>
    </div>

    <div class="field">
      <label for="amount">Amount (€)</label>
      <input id="amount" class="in big" type="number" inputmode="decimal"
             step="0.01" min="0" placeholder="0.00" [(ngModel)]="amount">
    </div>

    <div class="field">
      <label for="date">Date</label>
      <input id="date" class="in" type="date" [(ngModel)]="date">
    </div>

    <div class="field">
      <label>{{ type === 'expense' ? 'Paid from' : 'Deposited to' }}</label>
      <div class="seg">
        @for (a of accounts; track a.id) {
          <button type="button" class="chip" [class.on]="a.id === accountId" (click)="accountId = a.id">
            {{ a.name }}
          </button>
        }
      </div>
    </div>

    @if (type === 'expense') {
      <div class="field">
        <label>Category</label>
        <ion-select class="in-select" aria-label="Category" interface="popover"
                    placeholder="Choose a category" toggleIcon="chevron-down"
                    [value]="categoryId"
                    (ionChange)="categoryId = $event.detail.value">
          @for (c of categories; track c.id) {
            <ion-select-option [value]="c.id">{{ c.name }}</ion-select-option>
          }
        </ion-select>
      </div>
    }

    <div class="field">
      <label for="note">Note</label>
      <input id="note" class="in" type="text"
             [placeholder]="type === 'expense' ? 'What was it for?' : 'Who paid you?'"
             [(ngModel)]="note">
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar>
    <div class="footer">
      <ion-button color="primary" expand="block" [disabled]="!canSave" (click)="save()">
        Save transaction
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
